[pytest]
testpaths = tests
python_files = test_*.py
# Integration tests need a live server, Mongo and real HTTP, so they are opt-in:
#   pytest                                       -> unit tests only, no services
#   pytest tests/integration -m integration -s   -> the endpoint matrix
# Without the deselect a plain `pytest` would silently start depending on
# whatever happens to be listening on port 8000.
addopts = -q --tb=short -m "not integration"
markers =
    integration: needs a live server, Mongo and real HTTP
filterwarnings =
    ignore::DeprecationWarning
